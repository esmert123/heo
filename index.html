<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --bg: #f4f7fb;
    --card: #ffffff;
    --card-rgb: 255,255,255;
    --stroke: rgba(10,60,140,.12);
    --shadow: 0 18px 45px rgba(0,0,0,.10);
    --logoH: clamp(34px, 4.2vw, 54px);
    --tileW: clamp(120px, 14vw, 200px);
    --gap: clamp(14px, 2.6vw, 42px);
    --speed: 44s;
  }
  html,body{margin:0;padding:0;background:transparent;font-family:Arial, sans-serif;}

  .refs-wrap{
    width:100%;
    background: var(--bg);
    padding: 16px 14px;
    box-sizing: border-box;
  }

  .marquee{
    width:min(1280px, 100%);
    margin: 0 auto;
    position: relative;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    padding: 12px 10px;
  }

  /* Hover'da çıkan sade başlık */
  .hover-title{
    position:absolute;
    left: 14px;
    top: 10px;
    z-index: 5;
    pointer-events:none;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: .2px;
    color: rgba(12,32,64,.92);
    background: rgba(255,255,255,.78);
    border: 1px solid rgba(11,94,215,.18);
    border-radius: 999px;
    padding: 6px 10px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .18s ease, transform .18s ease;
    backdrop-filter: blur(8px);
  }
  .marquee:hover .hover-title{
    opacity: 1;
    transform: translateY(0);
  }

  /* Kenarlarda yumuşak fade - kart arka planına uyumlu */
  .marquee:before,
  .marquee:after{
    content:"";
    position:absolute; top:0; bottom:0;
    width: 60px;
    pointer-events:none;
    z-index: 4;
  }
  .marquee:before{
    left:0;
    background: linear-gradient(90deg, rgba(var(--card-rgb),1), rgba(var(--card-rgb),0));
  }
  .marquee:after{
    right:0;
    background: linear-gradient(270deg, rgba(var(--card-rgb),1), rgba(var(--card-rgb),0));
  }

  .track{
    display:flex;
    align-items:center;
    gap: var(--gap);
    width: max-content;
    will-change: transform;
    animation: scroll var(--speed) linear infinite;
    transform: translate3d(0,0,0);
  }

  /* Hover'da akış dursun */
  .marquee:hover .track{ animation-play-state: paused; }

  .item{
    width: var(--tileW);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 8px 6px;
    border-radius: 14px;
    flex-shrink: 0;
  }

  .item img{
    max-height: var(--logoH);
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    transition: transform .18s ease;
  }

  .item:hover img{
    transform: translateY(-1px);
  }

  @keyframes scroll{
    from{ transform: translate3d(0,0,0); }
    to{ transform: translate3d(-50%,0,0); }
  }

  @media (max-width:520px){
    .refs-wrap{ padding: 12px 10px; }
    .marquee{ border-radius: 16px; padding: 10px 8px; }
    .marquee:before,.marquee:after{ width: 44px; }
    .hover-title{ left: 10px; top: 8px; font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .track{ animation: none; }
    .marquee:before,.marquee:after{ display:none; }
  }
</style>
</head>
<body>

  </div>
</section>
<script>
  (function(){
    const track = document.getElementById("track");
    // Sonsuz akış için iki kez çoğalt
    track.innerHTML += track.innerHTML;
    // Çok kısa içerikte boşluk kalmasın diye gerekirse 3. kez çoğalt
    requestAnimationFrame(() => {
      const marquee = track.closest(".marquee");
      if (marquee && track.scrollWidth < marquee.clientWidth * 2) {
        track.innerHTML += track.innerHTML;
      }
    });
  })();
</script>

</html>
