<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HEO HERO SLIDER
   ============================================================ */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0e1a;
    color: #ffffff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* ---- SLIDER WRAPPER ---- */
.slider-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: #0a0e1a;
}

/* ---- SLIDE ---- */
.slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    z-index: 1;
}
.slide.active {
    opacity: 1;
    visibility: visible;
    z-index: 2;
}

/* ---- BACKGROUND ---- */
.slide-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #0a0e1a 0%, #0d1527 25%, #111d35 50%, #0f1a30 75%, #0a0e1a 100%);
}
.slide-bg::after {
    content: '';
    position: absolute;
    top: -50%; right: -20%;
    width: 80%; height: 200%;
    background: radial-gradient(ellipse, rgba(0,122,255,0.06) 0%, rgba(0,82,204,0.03) 40%, transparent 70%);
}
.grid-lines {
    position: absolute;
    inset: 0;
    opacity: 0.025;
    background-image:
        linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
    background-size: 60px 60px;
}

/* ---- LEFT CONTENT ---- */
.slide-content {
    position: relative;
    z-index: 2;
    width: 55%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 40px 160px 60px;
}

/* Promo Badge */
.promo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,122,255,0.12);
    border: 1px solid rgba(0,122,255,0.25);
    border-radius: 50px;
    padding: 6px 18px;
    font-size: 11px;
    font-weight: 700;
    color: #4da3ff;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    margin-bottom: 14px;
    width: fit-content;
    opacity: 0; transform: translateY(20px);
    transition: all 0.6s ease 0.15s;
}
.promo-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #007aff;
    animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(1.6); }
}
.slide.active .promo-badge { opacity:1; transform:translateY(0); }

/* Promo2 */
.promo2 {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0; transform: translateY(20px);
    transition: all 0.6s ease 0.25s;
}
.slide.active .promo2 { opacity:1; transform:translateY(0); }

/* Title */
.slide-title {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: clamp(34px, 4.2vw, 60px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
    margin-bottom: 18px;
    background: linear-gradient(135deg, #ffffff 0%, #c8d8ec 55%, #8badd4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0; transform: translateY(30px);
    transition: all 0.7s ease 0.3s;
}
.slide.active .slide-title { opacity:1; transform:translateY(0); }

/* Description */
.slide-desc {
    font-size: 14.5px;
    line-height: 1.75;
    color: rgba(255,255,255,0.5);
    max-width: 460px;
    margin-bottom: 24px;
    opacity: 0; transform: translateY(20px);
    transition: all 0.6s ease 0.4s;
}
.slide.active .slide-desc { opacity:1; transform:translateY(0); }

/* Features */
.features {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
    opacity: 0; transform: translateY(20px);
    transition: all 0.6s ease 0.5s;
}
.slide.active .features { opacity:1; transform:translateY(0); }

.ftag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(255,255,255,0.72);
    transition: all 0.3s ease;
    white-space: nowrap;
}
.ftag:hover {
    background: rgba(0,122,255,0.1);
    border-color: rgba(0,122,255,0.3);
    color: #fff;
}
.ftag svg {
    width: 13px; height: 13px;
    fill: none; stroke: #007aff;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
}

/* CTA Buttons */
.cta-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    opacity: 0; transform: translateY(20px);
    transition: all 0.6s ease 0.6s;
}
.slide.active .cta-row { opacity:1; transform:translateY(0); }

.btn1 {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 30px;
    background: linear-gradient(135deg, #007aff, #0055cc);
    color: #fff; font-size: 13.5px; font-weight: 600;
    border: none; border-radius: 11px; cursor: pointer;
    letter-spacing: 0.3px;
    transition: all 0.3s ease;
    position: relative; overflow: hidden;
}
.btn1::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
}
.btn1:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,122,255,0.35); }
.btn1:hover::after { transform: translateX(100%); }
.btn1 svg {
    width: 15px; height: 15px;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    transition: transform 0.3s ease;
}
.btn1:hover svg { transform: translateX(3px); }

.btn2 {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 26px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.85);
    font-size: 13.5px; font-weight: 500;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 11px; cursor: pointer;
    transition: all 0.3s ease;
}
.btn2:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-2px);
}
.btn2 svg {
    width: 15px; height: 15px;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

/* ---- RIGHT VISUAL ---- */
.slide-visual {
    position: relative;
    z-index: 1;
    width: 45%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.img-wrap {
    position: relative;
    width: 85%; height: 70%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.img-wrap::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,122,255,0.1) 0%, transparent 70%);
    filter: blur(40px);
}
.hero-img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
    opacity: 0;
    transform: scale(0.92) translateX(30px);
    transition: all 0.8s ease 0.25s;
}
.slide.active .hero-img {
    opacity: 1;
    transform: scale(1) translateX(0);
}

/* Floating dots */
.fdot {
    position: absolute;
    border-radius: 50%;
    background: rgba(0,122,255,0.35);
    filter: blur(1px);
    animation: fdot 6s ease-in-out infinite;
}
.fdot:nth-child(1) { width:6px;height:6px; top:18%;right:14%; animation-delay:0s; }
.fdot:nth-child(2) { width:4px;height:4px; top:58%;right:22%; animation-delay:2s; }
.fdot:nth-child(3) { width:7px;height:7px; top:38%;right:8%;  animation-delay:4s; background:rgba(0,200,255,0.25); }

@keyframes fdot {
    0%,100% { transform:translateY(0) translateX(0); opacity:0.5; }
    25% { transform:translateY(-12px) translateX(6px); opacity:1; }
    50% { transform:translateY(-4px) translateX(-4px); opacity:0.3; }
    75% { transform:translateY(-16px) translateX(3px); opacity:0.7; }
}

/* ---- APPLICATION AREAS (BOTTOM) ---- */
.app-areas {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    z-index: 10;
    background: linear-gradient(180deg, transparent 0%, rgba(5,8,18,0.97) 35%);
    padding: 45px 60px 28px;
}
.areas-hdr {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 14px;
}
.areas-lbl {
    font-size: 11px; font-weight: 700;
    color: rgba(255,255,255,0.35);
    letter-spacing: 3px;
    text-transform: uppercase;
    white-space: nowrap;
}
.areas-line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
}
.areas-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: none;
}
.areas-row::-webkit-scrollbar { display:none; }

.acard {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    transition: all 0.3s ease;
    cursor: default;
}
.acard:hover {
    background: rgba(0,122,255,0.08);
    border-color: rgba(0,122,255,0.2);
    transform: translateY(-2px);
}
.acard-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: rgba(0,122,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.acard-icon img {
    width: 26px; height: 26px;
    object-fit: contain;
    filter: brightness(0) invert(1) opacity(0.75);
}
.acard-icon svg {
    width: 26px; height: 26px;
}
.acard-title {
    font-size: 13.5px; font-weight: 500;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
}

/* ---- NAVIGATION ---- */
.nav-left {
    position: absolute;
    left: 60px; bottom: 130px;
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 18px;
}
.dots { display:flex; align-items:center; gap:7px; }
.dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: none; padding: 0;
    cursor: pointer;
    transition: all 0.4s ease;
}
.dot.on {
    width: 30px;
    border-radius: 4px;
    background: linear-gradient(90deg, #007aff, #00aaff);
}
.dot:hover:not(.on) { background: rgba(255,255,255,0.35); }
.counter {
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.3);
    font-variant-numeric: tabular-nums;
}
.counter b {
    color: #fff; font-size: 15px; font-weight: 700;
}

.nav-right {
    position: absolute;
    right: 60px; bottom: 130px;
    z-index: 15;
    display: flex; gap: 8px;
}
.arrow {
    width: 42px; height: 42px;
    border-radius: 11px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease;
}
.arrow:hover {
    background: rgba(0,122,255,0.12);
    border-color: rgba(0,122,255,0.3);
}
.arrow svg {
    width: 17px; height: 17px;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

/* Progress bar */
.pbar-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    z-index: 20;
    background: rgba(255,255,255,0.04);
}
.pbar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #007aff, #00c8ff);
    border-radius: 0 2px 2px 0;
    transition: width 0.05s linear;
}

/* ---- DEBUG PANEL ---- */
.debug {
    position: absolute;
    top: 8px; right: 8px;
    z-index: 999;
    background: rgba(0,0,0,0.85);
    color: #0f0;
    font-family: monospace;
    font-size: 10px;
    padding: 6px 10px;
    border-radius: 6px;
    display: none;
    max-width: 280px;
    word-break: break-all;
}

/* ---- RESPONSIVE ---- */
@media (max-width:1024px) {
    .slide-content { width:60%; padding:40px 30px 150px 40px; }
    .slide-visual { width:40%; }
    .app-areas { padding:35px 40px 22px; }
    .nav-left { left:40px; bottom:110px; }
    .nav-right { right:40px; bottom:110px; }
}
@media (max-width:768px) {
    .slide { flex-direction:column; }
    .slide-content { width:100%; height:60%; padding:20px 20px 140px; justify-content:flex-end; }
    .slide-visual { width:100%; height:50%; position:absolute; top:0; opacity:0.25; }
    .slide-title { font-size: clamp(26px,6vw,38px); }
    .features { display:none; }
    .app-areas { padding:20px 20px 14px; }
    .nav-left { left:20px; bottom:100px; }
    .nav-right { right:20px; bottom:100px; }
    .acard { padding:10px 16px; }
    .acard-icon { width:38px; height:38px; }
    .acard-icon img, .acard-icon svg { width:22px; height:22px; }
}
</style>
</head>
<body>

<div class="slider-wrapper" id="wrap">
    <!-- Progress -->
    <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>

    <!-- Slides container -->
    <div id="slides"></div>

    <!-- App Areas -->
    <div class="app-areas" id="appAreas">
        <div class="areas-hdr">
            <span class="areas-lbl">Uygulama Alanları</span>
            <div class="areas-line"></div>
        </div>
        <div class="areas-row" id="areasRow"></div>
    </div>

    <!-- Nav left -->
    <div class="nav-left">
        <div class="dots" id="dots"></div>
        <div class="counter"><b id="cCur">01</b> / <span id="cTot">01</span></div>
    </div>

    <!-- Nav right -->
    <div class="nav-right">
        <button class="arrow" id="btnPrev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="arrow" id="btnNext"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
    </div>

    <!-- Debug -->
    <div class="debug" id="dbg"></div>
</div>

<script>
(function(){
    'use strict';

    // ============ CONFIG ============
    var AUTOPLAY_MS = 7000;
    var TICK_MS = 50;
    var DATA_TIMEOUT_MS = 4000; // 4sn sonra demo data yükle
    var USE_DEMO_ON_TIMEOUT = true;

    // ============ STATE ============
    var heroSlides = [];
    var appAreas = [];
    var cur = 0;
    var progVal = 0;
    var progTimer = null;
    var dataReceived = false;

    // ============ DOM ============
    var $slides   = document.getElementById('slides');
    var $areasRow = document.getElementById('areasRow');
    var $appAreas = document.getElementById('appAreas');
    var $dots     = document.getElementById('dots');
    var $cCur     = document.getElementById('cCur');
    var $cTot     = document.getElementById('cTot');
    var $pbar     = document.getElementById('pbar');
    var $btnPrev  = document.getElementById('btnPrev');
    var $btnNext  = document.getElementById('btnNext');
    var $dbg      = document.getElementById('dbg');

    // ============ SVG ICONS ============
    var icoCheck = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
    var icoArrow = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    var icoPhone = '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
    var icoDefault = '<svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';

    // ============ DEMO DATA ============
    var DEMO_SLIDES = [
        {
            productKey: "tribolog",
            title: "UTS TRIBOLOG",
            promo: "YENİ ÜRÜN",
            promo2: "UNIVERSAL TEST SİSTEMLERİ",
            description: "Triboloji test cihazı, sürtünme ve aşınma testleri için modüler ve esnek bir platform sunar.",
            heroImageUrl: "",
            features: "Modüler Test Platformu,Esnek Tasarım,Hassas Ölçüm,Geniş Sıcaklık Aralığı",
            primaryCtaText: "Ürünü İncele",
            primaryCtaLink: "/urunler/uts-tribolog",
            secondaryCtaText: "Teklif Al",
            secondaryCtaLink: "/iletisim"
        },
        {
            productKey: "hardness",
            title: "UTS HARDNESS",
            promo: "POPÜLER",
            promo2: "SERTLIK TEST CİHAZLARI",
            description: "Yüksek hassasiyetli sertlik ölçüm sistemleri. Rockwell, Brinell ve Vickers yöntemlerini tek platformda birleştirir.",
            heroImageUrl: "",
            features: "Çoklu Test Yöntemi,Otomatik Ölçüm,Dijital Raporlama,Kolay Kalibrasyon",
            primaryCtaText: "Ürünü İncele",
            primaryCtaLink: "/urunler/uts-hardness",
            secondaryCtaText: "Teklif Al",
            secondaryCtaLink: "/iletisim"
        }
    ];

    var DEMO_AREAS = [
        { productKey: "tribolog", title: "Otomotiv", iconUrl: "" },
        { productKey: "tribolog", title: "Havacılık", iconUrl: "" },
        { productKey: "tribolog", title: "Enerji", iconUrl: "" },
        { productKey: "hardness", title: "Savunma", iconUrl: "" },
        { productKey: "hardness", title: "Akademik", iconUrl: "" },
        { productKey: "hardness", title: "Medikal", iconUrl: "" }
    ];

    // ============ MESSAGE LISTENER ============
    window.addEventListener('message', function(e) {
        var d = e.data;
        if (!d) return;

        // Velo'dan gelen veri
        if (d.type === 'sliderData') {
            dataReceived = true;
            heroSlides = d.heroSlides || [];
            appAreas = d.applicationAreas || [];
            buildAll();
        }

        // CMS hatası
        if (d.type === 'cmsError') {
            dbg('CMS Hatasi: ' + d.message);
            if (!dataReceived) loadDemo();
        }
    });

    // ============ INIT ============
    // Velo'ya "hazırım" mesajı gönder
    try {
        window.parent.postMessage({ type: 'iframeReady' }, '*');
    } catch(ex) {}

    // Timeout: veri gelmezse demo yükle
    if (USE_DEMO_ON_TIMEOUT) {
        setTimeout(function() {
            if (!dataReceived) {
                dbg('Veri gelmedi, demo yukleniyor...');
                loadDemo();
            }
        }, DATA_TIMEOUT_MS);
    }

    function loadDemo() {
        dataReceived = true;
        heroSlides = DEMO_SLIDES;
        appAreas = DEMO_AREAS;
        buildAll();
    }

    // ============ BUILD ALL ============
    function buildAll() {
        if (heroSlides.length === 0) return;
        renderSlides();
        renderDots();
        updateCounter();
        activate(0);
        startAuto();
        bindEvents();
    }

    // ============ RENDER SLIDES ============
    function renderSlides() {
        var html = '';
        heroSlides.forEach(function(s, i) {
            var feats = parseFeatures(s.features);
            var fhtml = '';
            feats.forEach(function(f) {
                fhtml += '<div class="ftag">' + icoCheck + '<span>' + esc(f) + '</span></div>';
            });

            html += '<div class="slide" data-i="' + i + '">' +
                '<div class="slide-bg"><div class="grid-lines"></div></div>' +
                '<div class="slide-content">' +
                    (s.promo ? '<div class="promo-badge"><span class="dot"></span>' + esc(s.promo) + '</div>' : '') +
                    (s.promo2 ? '<div class="promo2">' + esc(s.promo2) + '</div>' : '') +
                    '<h1 class="slide-title">' + esc(s.title) + '</h1>' +
                    (s.description ? '<p class="slide-desc">' + esc(s.description) + '</p>' : '') +
                    (fhtml ? '<div class="features">' + fhtml + '</div>' : '') +
                    '<div class="cta-row">' +
                        (s.primaryCtaText ? '<button class="btn1" data-href="' + escA(s.primaryCtaLink) + '">' + esc(s.primaryCtaText) + icoArrow + '</button>' : '') +
                        (s.secondaryCtaText ? '<button class="btn2" data-href="' + escA(s.secondaryCtaLink) + '">' + icoPhone + esc(s.secondaryCtaText) + '</button>' : '') +
                    '</div>' +
                '</div>' +
                '<div class="slide-visual">' +
                    '<div class="img-wrap">' +
                        '<div class="fdot"></div><div class="fdot"></div><div class="fdot"></div>' +
                        (s.heroImageUrl ? '<img class="hero-img" src="' + escA(s.heroImageUrl) + '" alt="' + escA(s.title) + '">' : '') +
                    '</div>' +
                '</div>' +
            '</div>';
        });
        $slides.innerHTML = html;

        // CTA click handlers
        var btns = document.querySelectorAll('.btn1, .btn2');
        for (var b = 0; b < btns.length; b++) {
            btns[b].addEventListener('click', function() {
                var url = this.getAttribute('data-href');
                if (url) {
                    try { window.parent.postMessage({ type: 'ctaClick', url: url }, '*'); } catch(ex) {}
                }
            });
        }
    }

    // ============ RENDER AREAS (productKey'e göre filtreli) ============
    function renderAreas(productKey) {
        if (appAreas.length === 0) {
            $appAreas.style.display = 'none';
            return;
        }

        // Aktif slide'ın productKey'ine göre filtrele
        var filtered = productKey
            ? appAreas.filter(function(a) { return a.productKey === productKey; })
            : appAreas;

        // Eşleşen yoksa tüm alanları göster
        if (filtered.length === 0) filtered = appAreas;

        $appAreas.style.display = '';
        var html = '';
        filtered.forEach(function(a) {
            var icon = a.iconUrl
                ? '<img src="' + escA(a.iconUrl) + '" alt="' + escA(a.title) + '">'
                : icoDefault;
            html += '<div class="acard">' +
                '<div class="acard-icon">' + icon + '</div>' +
                '<span class="acard-title">' + esc(a.title) + '</span>' +
            '</div>';
        });
        $areasRow.innerHTML = html;
    }

    // ============ RENDER DOTS ============
    function renderDots() {
        var html = '';
        for (var i = 0; i < heroSlides.length; i++) {
            html += '<button class="dot' + (i === 0 ? ' on' : '') + '" data-i="' + i + '"></button>';
        }
        $dots.innerHTML = html;

        var allDots = $dots.querySelectorAll('.dot');
        for (var d = 0; d < allDots.length; d++) {
            allDots[d].addEventListener('click', function() {
                goTo(parseInt(this.getAttribute('data-i')));
            });
        }
    }

    // ============ NAVIGATION ============
    function activate(idx) {
        var all = document.querySelectorAll('.slide');
        for (var s = 0; s < all.length; s++) all[s].classList.remove('active');

        var allD = $dots.querySelectorAll('.dot');
        for (var d = 0; d < allD.length; d++) allD[d].classList.toggle('on', d === idx);

        var target = document.querySelector('.slide[data-i="' + idx + '"]');
        if (target) target.classList.add('active');

        cur = idx;
        updateCounter();

        // Uygulama alanlarını aktif slide'ın productKey'ine göre güncelle
        var activeKey = heroSlides[idx] ? heroSlides[idx].productKey : '';
        renderAreas(activeKey);
    }

    function goTo(idx) {
        if (idx === cur) return;
        activate(idx);
        resetProg();
    }
    function goNext() {
        activate((cur + 1) % heroSlides.length);
        resetProg();
    }
    function goPrev() {
        activate((cur - 1 + heroSlides.length) % heroSlides.length);
        resetProg();
    }

    function updateCounter() {
        $cCur.textContent = pad(cur + 1);
        $cTot.textContent = pad(heroSlides.length);
    }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    // ============ AUTOPLAY ============
    function startAuto() {
        stopAuto();
        progVal = 0;
        $pbar.style.width = '0%';
        progTimer = setInterval(function() {
            progVal += TICK_MS;
            $pbar.style.width = ((progVal / AUTOPLAY_MS) * 100) + '%';
            if (progVal >= AUTOPLAY_MS) goNext();
        }, TICK_MS);
    }
    function stopAuto() {
        if (progTimer) { clearInterval(progTimer); progTimer = null; }
    }
    function resetProg() {
        progVal = 0;
        $pbar.style.width = '0%';
        if (progTimer) { stopAuto(); startAuto(); }
    }

    // ============ EVENTS ============
    function bindEvents() {
        $btnPrev.addEventListener('click', goPrev);
        $btnNext.addEventListener('click', goNext);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') goPrev();
            if (e.key === 'ArrowRight') goNext();
        });

        var wrap = document.getElementById('wrap');
        wrap.addEventListener('mouseenter', stopAuto);
        wrap.addEventListener('mouseleave', startAuto);

        // Touch
        var tx = 0;
        wrap.addEventListener('touchstart', function(e) {
            tx = e.changedTouches[0].screenX;
        }, { passive: true });
        wrap.addEventListener('touchend', function(e) {
            var diff = e.changedTouches[0].screenX - tx;
            if (Math.abs(diff) > 50) { diff > 0 ? goPrev() : goNext(); }
        }, { passive: true });
    }

    // ============ HELPERS ============
    function parseFeatures(str) {
        if (!str) return [];
        return str.split(/[,\n;|]+/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
    }
    function esc(t) {
        var d = document.createElement('div');
        d.textContent = t || '';
        return d.innerHTML;
    }
    function escA(t) {
        return String(t || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function dbg(msg) {
        // Debug paneli gostermek icin: $dbg.style.display = 'block';
        // $dbg.style.display = 'block';
        // $dbg.textContent = msg;
        console.log('[HEO Slider]', msg);
    }

})();
</script>

</body>
</html>
