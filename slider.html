<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ============================================================
   HEO HERO SLIDER - Tam Stil Dosyası
   ============================================================ */

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap');

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', 'Space Grotesk', sans-serif;
    background: #0a0e1a;
    color: #ffffff;
}

/* ---- ANA KONTEYNER ---- */
.slider-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
}

/* ---- HER BİR SLAYT ---- */
.slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.slide.active {
    opacity: 1;
    visibility: visible;
}

/* ---- ARKA PLAN GRADYANı ---- */
.slide-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.slide-bg::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg,
        #0a0e1a 0%,
        #0d1527 25%,
        #111d35 50%,
        #0f1a30 75%,
        #0a0e1a 100%);
    z-index: 0;
}

.slide-bg::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 80%;
    height: 200%;
    background: radial-gradient(ellipse at center,
        rgba(0, 122, 255, 0.06) 0%,
        rgba(0, 82, 204, 0.03) 40%,
        transparent 70%);
    z-index: 0;
}

/* ---- Dekoratif grid çizgileri ---- */
.grid-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.03;
    background-image:
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 60px 60px;
}

/* ---- İÇERİK BÖLÜMÜ (SOL) ---- */
.slide-content {
    position: relative;
    z-index: 2;
    width: 55%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 40px 60px 60px;
}

/* Promo badge */
.promo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 122, 255, 0.12);
    border: 1px solid rgba(0, 122, 255, 0.25);
    border-radius: 50px;
    padding: 6px 18px;
    font-size: 12px;
    font-weight: 600;
    color: #4da3ff;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
    width: fit-content;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.2s;
}

.promo-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #007aff;
    animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.5); }
}

.slide.active .promo-badge {
    opacity: 1;
    transform: translateY(0);
}

/* Promo2 - alt başlık */
.promo2 {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
}

.slide.active .promo2 {
    opacity: 1;
    transform: translateY(0);
}

/* Ana başlık */
.slide-title {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: clamp(36px, 4.5vw, 64px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #ffffff 0%, #c8d8ec 60%, #8badd4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.35s;
}

.slide.active .slide-title {
    opacity: 1;
    transform: translateY(0);
}

/* Açıklama */
.slide-description {
    font-size: 15px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.55);
    max-width: 480px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.45s;
}

.slide.active .slide-description {
    opacity: 1;
    transform: translateY(0);
}

/* ---- ÖZELLİKLER LİSTESİ ---- */
.features-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.55s;
}

.slide.active .features-list {
    opacity: 1;
    transform: translateY(0);
}

.feature-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.75);
    transition: all 0.3s ease;
}

.feature-tag:hover {
    background: rgba(0, 122, 255, 0.1);
    border-color: rgba(0, 122, 255, 0.3);
    color: #ffffff;
}

.feature-tag svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: #007aff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
}

/* ---- CTA BUTONLARI ---- */
.cta-group {
    display: flex;
    align-items: center;
    gap: 16px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.65s;
}

.slide.active .cta-group {
    opacity: 1;
    transform: translateY(0);
}

.btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #007aff 0%, #0055cc 100%);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

.btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.5s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0, 122, 255, 0.35);
}

.btn-primary:hover::before {
    left: 100%;
}

.btn-primary svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.3s ease;
}

.btn-primary:hover svg {
    transform: translateX(3px);
}

.btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-2px);
}

.btn-secondary svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* ---- GÖRSEL BÖLÜMÜ (SAĞ) ---- */
.slide-visual {
    position: relative;
    z-index: 1;
    width: 45%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.hero-image-container {
    position: relative;
    width: 85%;
    height: 75%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Arka plan ışık efekti */
.hero-image-container::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 122, 255, 0.12) 0%, transparent 70%);
    filter: blur(40px);
}

.hero-image {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.5));
    opacity: 0;
    transform: scale(0.9) translateX(40px);
    transition: all 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
}

.slide.active .hero-image {
    opacity: 1;
    transform: scale(1) translateX(0);
}

/* Yüzen dekoratif parçacıklar */
.floating-particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(0, 122, 255, 0.3);
    filter: blur(1px);
    animation: float-particle 6s ease-in-out infinite;
}

.floating-particle:nth-child(1) {
    width: 6px; height: 6px;
    top: 20%; right: 15%;
    animation-delay: 0s;
}
.floating-particle:nth-child(2) {
    width: 4px; height: 4px;
    top: 60%; right: 25%;
    animation-delay: 2s;
}
.floating-particle:nth-child(3) {
    width: 8px; height: 8px;
    top: 40%; right: 10%;
    animation-delay: 4s;
    background: rgba(0, 200, 255, 0.2);
}

@keyframes float-particle {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.6; }
    25% { transform: translateY(-15px) translateX(8px); opacity: 1; }
    50% { transform: translateY(-5px) translateX(-5px); opacity: 0.4; }
    75% { transform: translateY(-20px) translateX(3px); opacity: 0.8; }
}

/* ---- UYGULAMA ALANLARI BÖLÜMÜ ---- */
.application-areas {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 5;
    background: linear-gradient(180deg, transparent 0%, rgba(5, 8, 18, 0.95) 30%);
    padding: 40px 60px 30px;
}

.areas-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.areas-title {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 2.5px;
    text-transform: uppercase;
}

.areas-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent);
    margin-left: 20px;
}

.areas-grid {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

.areas-grid::-webkit-scrollbar {
    display: none;
}

.area-card {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    cursor: default;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: fit-content;
}

.area-card:hover {
    background: rgba(0, 122, 255, 0.08);
    border-color: rgba(0, 122, 255, 0.2);
    transform: translateY(-2px);
}

.area-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(0, 122, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.area-icon img {
    width: 20px;
    height: 20px;
    object-fit: contain;
    filter: brightness(0) invert(1) opacity(0.7);
}

.area-card-title {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    white-space: nowrap;
}

/* ---- NAVİGASYON KONTROLLERI ---- */
.slider-nav {
    position: absolute;
    left: 60px;
    bottom: 140px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 20px;
}

.nav-dots {
    display: flex;
    align-items: center;
    gap: 8px;
}

.nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    padding: 0;
}

.nav-dot.active {
    width: 32px;
    border-radius: 4px;
    background: linear-gradient(90deg, #007aff, #00aaff);
}

.nav-dot:hover:not(.active) {
    background: rgba(255, 255, 255, 0.4);
}

.slide-counter {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.35);
    font-variant-numeric: tabular-nums;
}

.slide-counter .current {
    color: #ffffff;
    font-weight: 700;
    font-size: 16px;
}

/* Ok butonları */
.nav-arrows {
    position: absolute;
    right: 60px;
    bottom: 140px;
    z-index: 10;
    display: flex;
    gap: 10px;
}

.nav-arrow {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}

.nav-arrow:hover {
    background: rgba(0, 122, 255, 0.15);
    border-color: rgba(0, 122, 255, 0.3);
}

.nav-arrow svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* ---- İLERLEME ÇUBUĞU (Otomatik kaydırma) ---- */
.progress-bar-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    z-index: 20;
    background: rgba(255, 255, 255, 0.05);
}

.progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #007aff, #00c8ff);
    width: 0%;
    transition: width 0.1s linear;
    border-radius: 0 2px 2px 0;
}

/* ---- YÜKLEME DURUMU ---- */
.loading-state {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0e1a;
    z-index: 100;
    transition: opacity 0.5s ease;
}

.loading-state.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #007aff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-text {
    margin-top: 16px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 1px;
}

/* ---- RESPONSIVE ---- */
@media (max-width: 1024px) {
    .slide-content {
        width: 60%;
        padding: 40px 30px 40px 40px;
    }
    .slide-visual {
        width: 40%;
    }
    .application-areas {
        padding: 30px 40px 24px;
    }
    .slider-nav {
        left: 40px;
        bottom: 120px;
    }
    .nav-arrows {
        right: 40px;
        bottom: 120px;
    }
}

@media (max-width: 768px) {
    .slide {
        flex-direction: column;
    }
    .slide-content {
        width: 100%;
        height: 55%;
        padding: 30px 24px;
        justify-content: flex-end;
    }
    .slide-visual {
        width: 100%;
        height: 45%;
        position: absolute;
        top: 0;
        opacity: 0.3;
    }
    .slide-title {
        font-size: clamp(28px, 6vw, 42px);
    }
    .features-list {
        display: none;
    }
    .application-areas {
        padding: 20px 24px 16px;
    }
    .slider-nav {
        left: 24px;
        bottom: 100px;
    }
    .nav-arrows {
        right: 24px;
        bottom: 100px;
    }
    .area-card {
        padding: 10px 14px;
    }
}
</style>
</head>
<body>

<!-- Yükleme Ekranı -->
<div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <div class="loading-text">Yükleniyor...</div>
</div>

<!-- Slider Ana Kapsayıcı -->
<div class="slider-wrapper" id="sliderWrapper" style="display:none;">

    <!-- İlerleme Çubuğu -->
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Slaytlar buraya dinamik olarak eklenir -->
    <div id="slidesContainer"></div>

    <!-- Uygulama Alanları -->
    <div class="application-areas" id="applicationAreas">
        <div class="areas-header">
            <span class="areas-title">Uygulama Alanları</span>
            <div class="areas-line"></div>
        </div>
        <div class="areas-grid" id="areasGrid"></div>
    </div>

    <!-- Navigasyon - Sol (Dots + Counter) -->
    <div class="slider-nav">
        <div class="nav-dots" id="navDots"></div>
        <div class="slide-counter">
            <span class="current" id="counterCurrent">01</span>
            <span>/</span>
            <span id="counterTotal">01</span>
        </div>
    </div>

    <!-- Navigasyon - Sağ (Oklar) -->
    <div class="nav-arrows">
        <button class="nav-arrow" id="prevBtn" aria-label="Önceki">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-arrow" id="nextBtn" aria-label="Sonraki">
            <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </button>
    </div>
</div>

<script>
// ============================================================
// HEO HERO SLIDER - JavaScript Motoru
// ============================================================

(function() {
    'use strict';

    // --- Durum Değişkenleri ---
    let slides = [];
    let areas = [];
    let currentIndex = 0;
    let autoPlayInterval = null;
    let progressInterval = null;
    let progressValue = 0;
    const AUTOPLAY_DURATION = 7000; // 7 saniye
    const PROGRESS_STEP = 50;      // ms

    // --- DOM Referansları ---
    const loadingState     = document.getElementById('loadingState');
    const sliderWrapper    = document.getElementById('sliderWrapper');
    const slidesContainer  = document.getElementById('slidesContainer');
    const areasGrid        = document.getElementById('areasGrid');
    const navDots          = document.getElementById('navDots');
    const counterCurrent   = document.getElementById('counterCurrent');
    const counterTotal     = document.getElementById('counterTotal');
    const progressBar      = document.getElementById('progressBar');
    const prevBtn          = document.getElementById('prevBtn');
    const nextBtn          = document.getElementById('nextBtn');

    // --- Velo'dan Mesaj Dinle ---
    window.onmessage = function(event) {
        if (event.data && event.data.type === 'sliderData') {
            slides = event.data.heroSlides || [];
            areas  = event.data.applicationAreas || [];
            initSlider();
        }
    };

    // --- SVG İkonları ---
    const checkSvg = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
    const arrowRightSvg = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    const phoneSvg = '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

    // --- Varsayılan ikon (uygulama alanları için) ---
    const defaultAreaIcon = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';

    // --- Slider'ı Başlat ---
    function initSlider() {
        if (slides.length === 0) {
            loadingState.querySelector('.loading-text').textContent = 'Slayt bulunamadı.';
            return;
        }

        renderSlides();
        renderAreas();
        renderDots();
        updateCounter();

        // İlk slaytı aktif et
        activateSlide(0);

        // Göster
        loadingState.classList.add('hidden');
        sliderWrapper.style.display = '';

        // Otomatik kaydırma başlat
        startAutoPlay();

        // Olay dinleyicileri
        prevBtn.addEventListener('click', goPrev);
        nextBtn.addEventListener('click', goNext);

        // Klavye desteği
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') goPrev();
            if (e.key === 'ArrowRight') goNext();
        });

        // Hover'da otomatik kaydırmayı durdur
        sliderWrapper.addEventListener('mouseenter', stopAutoPlay);
        sliderWrapper.addEventListener('mouseleave', startAutoPlay);

        // Touch/Swipe desteği
        let touchStartX = 0;
        sliderWrapper.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        sliderWrapper.addEventListener('touchend', function(e) {
            const diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) goPrev();
                else goNext();
            }
        }, { passive: true });
    }

    // --- Slaytları Oluştur ---
    function renderSlides() {
        slidesContainer.innerHTML = '';

        slides.forEach(function(slide, index) {
            // Özellikleri ayrıştır (virgülle ayrılmış veya satır sonu ile)
            let features = [];
            if (slide.features) {
                features = slide.features
                    .split(/[,\n;|]+/)
                    .map(function(f) { return f.trim(); })
                    .filter(function(f) { return f.length > 0; });
            }

            const featureTagsHtml = features.map(function(f) {
                return '<div class="feature-tag">' + checkSvg + '<span>' + escapeHtml(f) + '</span></div>';
            }).join('');

            const html = '' +
                '<div class="slide" data-index="' + index + '">' +
                    '<div class="slide-bg"><div class="grid-overlay"></div></div>' +
                    '<div class="slide-content">' +
                        (slide.promo ? '<div class="promo-badge"><span class="dot"></span>' + escapeHtml(slide.promo) + '</div>' : '') +
                        (slide.promo2 ? '<div class="promo2">' + escapeHtml(slide.promo2) + '</div>' : '') +
                        '<h1 class="slide-title">' + escapeHtml(slide.title) + '</h1>' +
                        (slide.description ? '<p class="slide-description">' + escapeHtml(slide.description) + '</p>' : '') +
                        (featureTagsHtml ? '<div class="features-list">' + featureTagsHtml + '</div>' : '') +
                        '<div class="cta-group">' +
                            (slide.primaryCtaText ?
                                '<button class="btn-primary" data-url="' + escapeAttr(slide.primaryCtaLink) + '">' +
                                    escapeHtml(slide.primaryCtaText) + arrowRightSvg +
                                '</button>' : '') +
                            (slide.secondaryCtaText ?
                                '<button class="btn-secondary" data-url="' + escapeAttr(slide.secondaryCtaLink) + '">' +
                                    phoneSvg + escapeHtml(slide.secondaryCtaText) +
                                '</button>' : '') +
                        '</div>' +
                    '</div>' +
                    '<div class="slide-visual">' +
                        '<div class="hero-image-container">' +
                            '<div class="floating-particle"></div>' +
                            '<div class="floating-particle"></div>' +
                            '<div class="floating-particle"></div>' +
                            (slide.heroImageUrl ?
                                '<img class="hero-image" src="' + escapeAttr(slide.heroImageUrl) + '" alt="' + escapeAttr(slide.title) + '">' :
                                '') +
                        '</div>' +
                    '</div>' +
                '</div>';

            slidesContainer.insertAdjacentHTML('beforeend', html);
        });

        // CTA tıklama olayları
        document.querySelectorAll('.btn-primary, .btn-secondary').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const url = this.getAttribute('data-url');
                if (url) {
                    window.parent.postMessage({ type: 'ctaClick', url: url }, '*');
                }
            });
        });
    }

    // --- Uygulama Alanlarını Oluştur ---
    function renderAreas() {
        if (areas.length === 0) {
            document.getElementById('applicationAreas').style.display = 'none';
            return;
        }

        areasGrid.innerHTML = '';

        areas.forEach(function(area) {
            const iconHtml = area.iconUrl
                ? '<img src="' + escapeAttr(area.iconUrl) + '" alt="' + escapeAttr(area.title) + '">'
                : defaultAreaIcon;

            const card = '' +
                '<div class="area-card">' +
                    '<div class="area-icon">' + iconHtml + '</div>' +
                    '<span class="area-card-title">' + escapeHtml(area.title) + '</span>' +
                '</div>';

            areasGrid.insertAdjacentHTML('beforeend', card);
        });
    }

    // --- Navigasyon Noktaları ---
    function renderDots() {
        navDots.innerHTML = '';
        slides.forEach(function(_, i) {
            const dot = document.createElement('button');
            dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
            dot.setAttribute('aria-label', 'Slayt ' + (i + 1));
            dot.addEventListener('click', function() {
                goToSlide(i);
            });
            navDots.appendChild(dot);
        });
    }

    // --- Slayt Geçişi ---
    function activateSlide(index) {
        document.querySelectorAll('.slide').forEach(function(s) {
            s.classList.remove('active');
        });
        document.querySelectorAll('.nav-dot').forEach(function(d, i) {
            d.classList.toggle('active', i === index);
        });

        const target = document.querySelector('.slide[data-index="' + index + '"]');
        if (target) target.classList.add('active');

        currentIndex = index;
        updateCounter();
    }

    function goToSlide(index) {
        if (index === currentIndex) return;
        activateSlide(index);
        resetProgress();
    }

    function goNext() {
        const next = (currentIndex + 1) % slides.length;
        activateSlide(next);
        resetProgress();
    }

    function goPrev() {
        const prev = (currentIndex - 1 + slides.length) % slides.length;
        activateSlide(prev);
        resetProgress();
    }

    // --- Sayaç Güncelle ---
    function updateCounter() {
        counterCurrent.textContent = String(currentIndex + 1).padStart(2, '0');
        counterTotal.textContent = String(slides.length).padStart(2, '0');
    }

    // --- Otomatik Kaydırma ---
    function startAutoPlay() {
        stopAutoPlay();
        progressValue = 0;
        progressBar.style.width = '0%';

        progressInterval = setInterval(function() {
            progressValue += PROGRESS_STEP;
            const pct = (progressValue / AUTOPLAY_DURATION) * 100;
            progressBar.style.width = pct + '%';

            if (progressValue >= AUTOPLAY_DURATION) {
                goNext();
            }
        }, PROGRESS_STEP);
    }

    function stopAutoPlay() {
        if (progressInterval) {
            clearInterval(progressInterval);
            progressInterval = null;
        }
    }

    function resetProgress() {
        progressValue = 0;
        progressBar.style.width = '0%';
        // Eğer autoplay aktifse yeniden başlat
        if (progressInterval) {
            stopAutoPlay();
            startAutoPlay();
        }
    }

    // --- Yardımcı Fonksiyonlar ---
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function escapeAttr(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

})();
</script>

</body>
</html>
